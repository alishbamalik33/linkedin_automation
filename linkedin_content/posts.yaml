    content: |
      I’ve been learning more about Retrieval-Augmented Generation (RAG), and one concept that stood out to me is how retrieval can help an LLM work with external knowledge.

      Instead of relying only on what the model already knows, a RAG system can retrieve relevant information and provide it as context before generating a response.

      I’m currently exploring RAG with LangChain, vector databases, embeddings, and Gemini.

      #AI #GenerativeAI #RAG #MachineLearning #LLM

  - id: 2
    date: "2026-09-23"
    status: "pending"
    content: |
      One thing I’ve learned while working with AI applications is that embeddings are a key part of modern RAG systems.

      Embeddings convert text into numerical representations that allow semantically similar pieces of information to be found even when they don't use exactly the same words.

      This makes semantic search possible and is one of the concepts I’m focusing on while learning RAG.

      #AI #RAG #Embeddings #GenerativeAI #MachineLearning

