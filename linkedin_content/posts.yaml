      I’ve been exploring ChromaDB as a vector database while building RAG-based applications.

      One of the interesting parts is seeing how documents can be converted into embeddings, stored, and later retrieved based on semantic similarity.

      Working through these concepts practically has helped me understand RAG much better than learning the theory alone.

      #AI #ChromaDB #RAG #GenAI #Python

